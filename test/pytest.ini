[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = bak .git __pycache__ .venv node_modules

# 标记注册
markers =
    slow: 慢速测试（需要等待异步操作）
    read_only: 只读查询，无副作用
    dispatch: 任务分派与执行
    notice: 公告系统
    lifecycle: Agent 生命周期管理
    project: 项目管理
    host: 主机管理
    task: 任务定义
    task_visibility: Task 可见性权限校验
    group: Agent 团队
    monitor: 运行时监控
    schedule: 制定计划 & 激活
    plan: JSON Plan 部署
    exec_name: 执行实例短标题（exec_name）
    ownership: 资源级权属校验（ownership）
    session: 会话体系（agx_session）
    self_dispatch: 自我调度出口（ao_self_dispatch）

# 输出
addopts = -v --tb=short --color=yes
